name: Bug report
description: Report a workflow step that fails or produces unexpected results
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please note that the BC CEF Forest Disturbance
        layer is not publicly distributed — if the workflow stops asking for it, that is
        expected. See
        [Data access](https://github.com/Heckford/bc-connectivity#data-access).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Which target failed?
      description: The `targets` target name, if applicable (e.g. `seral_patches`).
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the full error and traceback. This is rendered as code, no backticks needed.
      render: text
    validations:
      required: true

  - type: textarea
    id: session
    attributes:
      label: Session info
      description: Output of `sessionInfo()`, or the relevant part of your `INFO.md`.
      render: text
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: R and Julia versions
      placeholder: "R 4.5.3, Julia 1.11.7"
    validations:
      required: false
